version: "3.8"

services:
  acdante-db-inspector:
    build:
      context: .
      dockerfile: Dockerfile
    image: acdante/db-inspector:latest
    container_name: acdante-db-inspector
    restart: unless-stopped
    ports:
      - "5003:5003"
    volumes:
      # Persist SQLite databases and config
      - acdante_data:/app/data
      # Persist pro_data (RBAC users.db, um_rbac.db)
      - acdante_pro_data:/app/pro_data
      # Persist generated reports
      - acdante_reports:/app/reports
      # Mount drivers directory (read-only)
      - ./drivers:/app/drivers:ro
    environment:
      - TZ=Asia/Shanghai
      - FLASK_ENV=production
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5003/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - acdante_net

volumes:
  acdante_data:
  acdante_pro_data:
  acdante_reports:

networks:
  acdante_net:
    driver: bridge
